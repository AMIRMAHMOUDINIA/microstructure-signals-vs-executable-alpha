[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microalpha"
version = "1.0.0"
description = "Research case study on BTCUSDT microstructure signals, robustness, and economic viability"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
